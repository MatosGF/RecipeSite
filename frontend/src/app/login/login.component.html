<div class="elements">
  <h2>Login</h2>
  <form [formGroup]="logInForm" (ngSubmit)="onSubmit()">
    <div class="email">
      <p>E-mail</p>
      <input
        type="text"
        placeholder="Email"
        formControlName="email"
      >
    </div>

    <div class="password">
      <p>Senha</p>
      <input
        type="password"
        placeholder="Senha"
        formControlName="password"
      >
    </div>

    <a routerLink="/resetsenha">Esqueceu sua senha?</a>

    <button type="submit">Entrar</button>

    <div class="register">
      <p>Ainda não é cadastrado?</p>
      <button type="button" (click)="navegatetosignin()">Cadastre-se já!</button>
    </div>

    <p *ngIf="erroLogin" class="erro">{{ erroLogin }}</p>
  </form>
</div>
